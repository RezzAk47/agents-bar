# Release smoke test: builds the REAL release bundles (the same commands as release.yml) and runs the INSTALLED app on real
# Linux (x86_64, .deb and .AppImage), Windows (NSIS installer) and macOS (.dmg) with synthetic data only.
# Run by hand: gh workflow run release-smoke.yml --ref <branch>. Nothing is published; the screenshots and logs are artifacts.
# NOT YET EXECUTED: GitHub Actions has never run this file. Expect small fixes on the first real run.
# Pins: the same full commit SHAs as release.yml; no other third-party actions; everything else is plain shell / PowerShell.
name: release-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64 (.deb and .AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PRODUCT: 'Agents Bar'
      SLUG: 'agents-bar-cross'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux system packages (WebKitGTK, tray, build tools) and the virtual desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
          sudo apt-get install -y xvfb xdotool imagemagick dbus-x11 openbox x11-utils python3

      - name: Install npm packages
        run: npm ci

      - name: Build the release bundles (same as release.yml)
        run: npm run tauri build -- --bundles deb,appimage

      - name: Write the smoke scripts
        run: |
          mkdir -p "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/smoke-out"
          cat > "$RUNNER_TEMP/smoke/helper.py" <<'HELPER_EOF'
          import json, os, sys, time, datetime
          root = sys.argv[2]
          now = time.time()
          iso = lambda s: datetime.datetime.fromtimestamp(s, datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          rec = lambda o: json.dumps(o) + "\n"
          sub = os.path.join(root, "claude", "-proj", "sess", "subagents"); os.makedirs(sub, exist_ok=True)
          cx = os.path.join(root, "codex", *datetime.date.today().isoformat().split("-")); os.makedirs(cx, exist_ok=True)
          cp = os.path.join(sub, "agent-c1.jsonl")
          with open(cp, "w") as h:
              h.write(rec({"type": "user", "timestamp": iso(now - 30), "cwd": "/demo/cwd", "message": {"role": "user", "content": [{"type": "text", "text": "do a demo task"}]}}))
              h.write(rec({"type": "assistant", "timestamp": iso(now - 20), "message": {"id": "m1", "usage": {"input_tokens": 10, "output_tokens": 20}, "content": [{"type": "text", "text": "working\nPROGRESS: 40% - demo claude note"}]}}))
          with open(cp.replace(".jsonl", ".meta.json"), "w") as h: json.dump({"agentType": "explorer", "description": "Demo Claude task", "prompt": "demo"}, h)
          xp = os.path.join(cx, "rollout-x1.jsonl")
          item = lambda p, ts: rec({"timestamp": iso(ts), "type": "response_item", "payload": p})
          with open(xp, "w") as h:
              h.write(rec({"timestamp": iso(now - 40), "type": "event_msg", "payload": {"type": "task_started"}}))
              h.write(item({"type": "message", "role": "user", "content": [{"type": "input_text", "text": "Demo Codex task"}]}, now - 37))
              h.write(item({"type": "message", "role": "assistant", "content": [{"type": "output_text", "text": "reply\nPROGRESS: 60% - demo codex note"}]}, now - 20))
              h.write(rec({"timestamp": iso(now - 10), "type": "turn_context", "payload": {"cwd": "/demo/work", "model": "demo-model"}}))
          HELPER_EOF
          cat > "$RUNNER_TEMP/smoke/prep.sh" <<'PREP_EOF'
          prep_env() {
            export AGENTSBAR_TEST=1 AGENTSBAR_DATA_DIR="$1/data" AGENTSBAR_CLAUDE_DIR="$1/t/claude" AGENTSBAR_CODEX_DIR="$1/t/codex" AGENTSBAR_NO_NOTIFICATIONS=1
            export AGENTSBAR_GH="$GITHUB_WORKSPACE/scripts/fake-gh.sh"
            chmod +x "$AGENTSBAR_GH"
            mkdir -p "$AGENTSBAR_DATA_DIR"
            python3 "$RUNNER_TEMP/smoke/helper.py" agents-transcripts "$1/t"
          }
          PREP_EOF
          cat > "$RUNNER_TEMP/smoke/smoke.sh" <<'SMOKE_EOF'
          # usage: smoke.sh <label> <command...>   (run inside xvfb-run + dbus-launch; BINNAME, PRODUCT, RUNNER_TEMP are set)
          label=$1; shift
          out="$RUNNER_TEMP/smoke-out"; mkdir -p "$out"
          fails=0
          pass() { echo "PASS: $*"; }
          fail() { echo "FAIL: $*"; fails=$((fails+1)); }
          warn() { echo "WARN: $*"; }
          root=$(mktemp -d)
          export HOME="$root/home"; mkdir -p "$HOME"
          export XDG_RUNTIME_DIR="$root/run"; mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          . "$RUNNER_TEMP/smoke/prep.sh"; prep_env "$root"
          echo "[$label] throwaway HOME=$HOME, display=$DISPLAY, binary name=$BINNAME"
          PAT="^[^ ]*[/]${BINNAME}( |\$)"   # anchored at the start of the command line, so this script and xvfb-run never match
          alive() { kill -0 "$PID" 2>/dev/null || pgrep -f "$PAT" >/dev/null; }

          openbox >"$out/$label-openbox.log" 2>&1 &
          OB=$!
          sleep 2

          "$@" >"$out/$label-app.out.log" 2>"$out/$label-app.err.log" &
          PID=$!
          sleep 10
          if alive; then pass "[$label] the app is alive after 10 s"; else fail "[$label] the app is not running after 10 s"; fi
          if grep -q 'tray icon created' "$out/$label-app.err.log"; then pass "[$label] stderr says the tray icon was created"; else fail "[$label] no 'tray icon created' line in stderr"; fi

          xwininfo -root -tree > "$out/$label-xwininfo-before.txt" 2>&1
          echo "--- X windows before the second launch:"; sed 's/^/  /' "$out/$label-xwininfo-before.txt" | head -40
          # Tray icon: an AppIndicator has no X window of its own without a StatusNotifier host, so this is a soft check.
          # (the old check also accepted any visible window of the binary's own class, which is not a tray icon, so only the tree text counts now)
          if grep -qiE 'tray|indicator|statusnotifier' "$out/$label-xwininfo-before.txt"; then
            pass "[$label] an X window that looks like a tray icon exists"
          else
            warn "[$label] no tray-icon X window (expected: no StatusNotifier host runs in this virtual desktop; the log line above is the tray evidence)"
          fi

          # second launch = single-instance toggle: the popup should appear
          "$@" >"$out/$label-app2.out.log" 2>&1 &
          WID=""
          for i in $(seq 1 40); do
            WID=$(xdotool search --onlyvisible --name "^${PRODUCT}\$" 2>/dev/null | head -n 1)
            [ -n "$WID" ] && break
            sleep 0.5
          done
          sleep 1
          if [ -n "$WID" ]; then
            eval "$(xdotool getwindowgeometry --shell "$WID")"
            pass "[$label] window '$PRODUCT' appeared (id $WID), size ${WIDTH}x${HEIGHT}"
            if [ "$WIDTH" -ge 380 ] && [ "$WIDTH" -le 460 ] && [ "$HEIGHT" -ge 580 ] && [ "$HEIGHT" -le 700 ]; then pass "[$label] popup size is roughly 420x640"; else fail "[$label] popup size ${WIDTH}x${HEIGHT} is not roughly 420x640"; fi
          else
            fail "[$label] no visible window titled '$PRODUCT' after the second launch"
          fi
          alive && pass "[$label] the first instance is still alive after the second launch" || fail "[$label] the first instance died after the second launch"

          xwininfo -root -tree > "$out/$label-xwininfo-after.txt" 2>&1
          if import -window root "$out/$label-screenshot.png" && [ -s "$out/$label-screenshot.png" ]; then
            pass "[$label] screenshot saved ($(wc -c < "$out/$label-screenshot.png") bytes)"
            # a screenshot of one flat colour means nothing was drawn (not even the popup)
            colors=$(identify -format '%k' "$out/$label-screenshot.png" 2>/dev/null)
            if [ -n "$colors" ] && [ "$colors" -ge 2 ]; then pass "[$label] the screenshot has more than one colour ($colors)"; else warn "[$label] the screenshot has $colors colour(s): it may be blank"; fi
          else
            fail "[$label] screenshot failed or is empty"
          fi

          n=$(find "$AGENTSBAR_DATA_DIR" -type f 2>/dev/null | wc -l); echo "[$label] files in the data folder: $n"
          echo "--- tray label lines in stderr:"; grep 'tray label' "$out/$label-app.err.log" 2>/dev/null | head -5 | sed 's/^/  /'
          # the default label is just "Agents Bar"; a count such as "2 running" proves the transcripts were really scanned
          if grep -qE 'tray label: [0-9]+ (running|finished)' "$out/$label-app.err.log"; then pass "[$label] the app scanned the synthetic transcripts and set a tray label with a count"; else warn "[$label] no tray label with a running/finished count in stderr (the scan may not have run or may have found nothing)"; fi

          pkill -f "$PAT" 2>/dev/null; kill "$PID" 2>/dev/null; sleep 1; pkill -9 -f "$PAT" 2>/dev/null
          kill "$OB" 2>/dev/null
          [ -n "${FAKE_PID:-}" ] && kill "$FAKE_PID" 2>/dev/null
          [ -f "$root/provider.log" ] && cp "$root/provider.log" "$out/$label-provider.log"
          find "$root" -type f | sed "s|^$root||" > "$out/$label-synthetic-files.txt"
          if [ "$fails" -gt 0 ]; then echo "RESULT [$label]: FAIL ($fails check(s) failed)"; exit 1; fi
          echo "RESULT [$label]: PASS"

          SMOKE_EOF
          chmod +x "$RUNNER_TEMP/smoke/smoke.sh"

      - name: Smoke test the installed .deb
        id: deb
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          echo "deb: $deb"
          sudo apt-get install -y "./$deb"
          pkg=$(dpkg-deb -f "$deb" Package)
          bin=$(dpkg -L "$pkg" | grep '^/usr/bin/' | head -n 1)
          echo "package: $pkg, installed binary: $bin"
          if [ ! -x "$bin" ]; then echo "FAIL: no executable under /usr/bin in the package"; exit 1; fi
          export BINNAME=$(basename "$bin")
          echo "BINNAME=$BINNAME" >> "$GITHUB_ENV"
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-launch --exit-with-session bash "$RUNNER_TEMP/smoke/smoke.sh" deb "$bin"

      - name: Smoke test the AppImage (extract and run, no FUSE)
        if: always()
        run: |
          app=$(ls "$PWD"/src-tauri/target/release/bundle/appimage/*.AppImage | head -n 1)
          echo "appimage: $app"
          chmod +x "$app"
          export BINNAME="${BINNAME:-$SLUG}"
          export APPIMAGE_EXTRACT_AND_RUN=1
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-launch --exit-with-session bash "$RUNNER_TEMP/smoke/smoke.sh" appimage "$app" --appimage-extract-and-run

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-linux
          path: ${{ runner.temp }}/smoke-out
          if-no-files-found: warn

  windows:
    name: Windows (NSIS installer)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PRODUCT: 'Agents Bar'
      SLUG: 'agents-bar-cross'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      - name: Build the release installer (same as release.yml)
        run: npm run tauri build -- --bundles nsis

      - name: Install silently, run, probe, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'smoke-out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $root = Join-Path $env:RUNNER_TEMP ('smoke-' + [guid]::NewGuid().ToString('N').Substring(0, 8))
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $script:fails = 0
          function Pass($m) { Write-Host "PASS: $m" }
          function Fail($m) { Write-Host "FAIL: $m"; $script:fails++ }
          function Warn($m) { Write-Host "WARN: $m" }
          function Check($ok, $m) { if ($ok) { Pass $m } else { Fail $m } }

          # P/Invoke: top-level windows of one process id, with title, visibility and size
          Add-Type -TypeDefinition @"
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class WinProbe {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc p, IntPtr l);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern bool GetWindowRect(IntPtr h, out RECT r);
            [StructLayout(LayoutKind.Sequential)] struct RECT { public int L, T, R, B; }
            public static string[] ForPids(uint[] pids) {
              var res = new List<string>();
              var set = new HashSet<uint>(pids);
              EnumWindows((h, l) => {
                uint pid; GetWindowThreadProcessId(h, out pid);
                if (!set.Contains(pid)) return true;
                var sb = new StringBuilder(256); GetWindowText(h, sb, 256);
                RECT r; GetWindowRect(h, out r);
                res.Add(pid + "|" + (IsWindowVisible(h) ? "1" : "0") + "|" + (r.R - r.L) + "|" + (r.B - r.T) + "|" + sb.ToString());
                return true;
              }, IntPtr.Zero);
              return res.ToArray();
            }
          }
          "@

          function Find-Exe {
            # Tauri 2 per-user NSIS installs go to %LOCALAPPDATA%\<productName>; per-machine ones to Program Files\<productName>.
            # The uninstall registry key (HKCU or HKLM) can also name the folder, so every source is tried.
            $dirs = @()
            $dirs += (Join-Path $env:LOCALAPPDATA $env:PRODUCT)
            $dirs += (Join-Path $env:LOCALAPPDATA $env:SLUG)
            foreach ($base in @("$env:LOCALAPPDATA\Programs", $env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($base -and (Test-Path -LiteralPath $base)) {
                foreach ($d in @(Get-ChildItem -LiteralPath $base -Directory -ErrorAction SilentlyContinue)) {
                  if ($d.Name -like "*$env:PRODUCT*" -or $d.Name -like "*$env:SLUG*") { $dirs += $d.FullName }
                }
              }
            }
            foreach ($e in @(Get-UninstallEntries)) {
              if ($e.InstallLocation) { $dirs += ([string]$e.InstallLocation).Trim('"') }
              if ($e.UninstallString) {
                $us = [string]$e.UninstallString
                if ($us -match '^"([^"]+)"') { $us = $Matches[1] }
                $dirs += (Split-Path -Parent $us)
              }
            }
            foreach ($d in $dirs) {
              if ($d -and (Test-Path -LiteralPath $d)) {
                $found = @(Get-ChildItem -LiteralPath $d -Filter *.exe -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch 'unins|uninstall' })
                $best = $found | Where-Object { $_.BaseName -eq $env:SLUG -or $_.BaseName -eq $env:PRODUCT } | Select-Object -First 1
                if (-not $best) { $best = $found | Select-Object -First 1 }
                if ($best) { return $best }
              }
            }
            return $null
          }

          function Get-UninstallEntries {
            # entries in the uninstall registry whose DisplayName looks like this product (HKCU first: a per-user install lives there)
            $res = @()
            foreach ($path in @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall')) {
              foreach ($k in @(Get-ChildItem -Path $path -ErrorAction SilentlyContinue)) {
                $p = Get-ItemProperty -Path $k.PSPath -ErrorAction SilentlyContinue
                if ($p -and $p.DisplayName -and ($p.DisplayName -like "*$env:PRODUCT*" -or $p.DisplayName -like "*$env:SLUG*")) { $res += $p }
              }
            }
            return $res
          }

          function Show-InstallDiagnostics {
            Write-Host '--- diagnostics: LOCALAPPDATA, depth 2'
            Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Depth 2 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Host '--- diagnostics: Program Files and Program Files (x86), top level'
            foreach ($pf in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) { if ($pf) { Get-ChildItem -LiteralPath $pf -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" } } }
            Write-Host '--- diagnostics: uninstall registry entries that look like this product'
            $entries = @(Get-UninstallEntries)
            if ($entries.Count -eq 0) { Write-Host '  (none in HKCU or HKLM)' }
            foreach ($e in $entries) { Write-Host "  DisplayName=$($e.DisplayName) InstallLocation=$($e.InstallLocation) UninstallString=$($e.UninstallString)" }
            Write-Host '--- diagnostics: every uninstall key name in HKCU'
            Get-ChildItem -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.PSChildName)" }
          }

          function Show-AppLogs {
            foreach ($n in @('windows-app.err.log', 'windows-app.out.log', 'windows-provider.log')) {
              $f = Join-Path $out $n
              if (Test-Path -LiteralPath $f) {
                Write-Host "--- $n (last 40 lines)"
                Get-Content -LiteralPath $f -Tail 40 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
              } else { Write-Host "--- $n does not exist" }
            }
          }

          # 1. install silently
          $installer = Get-ChildItem -Path 'src-tauri\target\release\bundle\nsis\*.exe' | Select-Object -First 1
          Write-Host "installer: $($installer.FullName)"
          # -Wait waits for the installer process, but an NSIS setup can hand over to a child, so the exe is polled for up to 60 s below
          $ip = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          Check ($ip.ExitCode -eq 0) "installer /S exited with code $($ip.ExitCode)"
          $exe = $null
          for ($i = 0; $i -lt 60 -and -not $exe; $i++) {
            $exe = Find-Exe
            if (-not $exe) { Start-Sleep -Seconds 1 }
          }
          Check ($null -ne $exe) "installed exe found: $($exe.FullName)"
          if ($null -eq $exe) {
            Show-InstallDiagnostics
            Write-Host 'RESULT: FAIL (the installed exe was not found, so nothing else could run)'; exit 1
          }
          $installDir = $exe.DirectoryName
          Get-ChildItem $installDir | Format-Table Name, Length | Out-Host

          # 2. synthetic environment and a temp APPDATA
          $env:APPDATA = Join-Path $root 'appdata'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\smoke" | Out-Null
          Set-Content -Path "$env:RUNNER_TEMP\smoke\helper.py" -Encoding utf8 -Value @'
          import json, os, sys, time, datetime
          root = sys.argv[2]
          now = time.time()
          iso = lambda s: datetime.datetime.fromtimestamp(s, datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          rec = lambda o: json.dumps(o) + "\n"
          sub = os.path.join(root, "claude", "-proj", "sess", "subagents"); os.makedirs(sub, exist_ok=True)
          cx = os.path.join(root, "codex", *datetime.date.today().isoformat().split("-")); os.makedirs(cx, exist_ok=True)
          cp = os.path.join(sub, "agent-c1.jsonl")
          with open(cp, "w") as h:
              h.write(rec({"type": "user", "timestamp": iso(now - 30), "cwd": "/demo/cwd", "message": {"role": "user", "content": [{"type": "text", "text": "do a demo task"}]}}))
              h.write(rec({"type": "assistant", "timestamp": iso(now - 20), "message": {"id": "m1", "usage": {"input_tokens": 10, "output_tokens": 20}, "content": [{"type": "text", "text": "working\nPROGRESS: 40% - demo claude note"}]}}))
          with open(cp.replace(".jsonl", ".meta.json"), "w") as h: json.dump({"agentType": "explorer", "description": "Demo Claude task", "prompt": "demo"}, h)
          xp = os.path.join(cx, "rollout-x1.jsonl")
          item = lambda p, ts: rec({"timestamp": iso(ts), "type": "response_item", "payload": p})
          with open(xp, "w") as h:
              h.write(rec({"timestamp": iso(now - 40), "type": "event_msg", "payload": {"type": "task_started"}}))
              h.write(item({"type": "message", "role": "user", "content": [{"type": "input_text", "text": "Demo Codex task"}]}, now - 37))
              h.write(item({"type": "message", "role": "assistant", "content": [{"type": "output_text", "text": "reply\nPROGRESS: 60% - demo codex note"}]}, now - 20))
              h.write(rec({"timestamp": iso(now - 10), "type": "turn_context", "payload": {"cwd": "/demo/work", "model": "demo-model"}}))
          '@
          $env:AGENTSBAR_TEST = '1'
          $env:AGENTSBAR_DATA_DIR = Join-Path $root 'data'
          New-Item -ItemType Directory -Force -Path $env:AGENTSBAR_DATA_DIR | Out-Null
          $env:AGENTSBAR_CLAUDE_DIR = Join-Path $root 't\claude'
          $env:AGENTSBAR_CODEX_DIR = Join-Path $root 't\codex'
          $env:AGENTSBAR_NO_NOTIFICATIONS = '1'
          # no AGENTSBAR_GH on Windows: scripts/fake-gh.sh is a POSIX shell script, so the app just finds no gh
          python "$env:RUNNER_TEMP\smoke\helper.py" agents-transcripts (Join-Path $root 't')

          # 3. first launch, wait 10 s, assert alive
          $procName = [IO.Path]::GetFileNameWithoutExtension($exe.Name)
          $p1 = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput "$out\windows-app.out.log" -RedirectStandardError "$out\windows-app.err.log"
          Start-Sleep -Seconds 10
          $procs = @(Get-Process -Name $procName -ErrorAction SilentlyContinue)
          Check ($procs.Count -ge 1) "process '$procName' is alive after 10 s ($($procs.Count) process(es))"
          $pids = [uint32[]]($procs | ForEach-Object { $_.Id })
          # WebView2 child processes belong to other pids; the main window belongs to the app pid
          $before = @(if ($pids.Count) { [WinProbe]::ForPids($pids) })
          Write-Host 'windows before the second launch (pid|visible|w|h|title):'
          $before | ForEach-Object { Write-Host "  $_" }
          $err = Get-Content "$out\windows-app.err.log" -Raw -ErrorAction SilentlyContinue
          if ($err -match 'tray icon created') { Pass 'stderr says the tray icon was created' } else { Warn 'no "tray icon created" line in stderr (a windows-subsystem exe may not write to the redirected handle)' }

          # 4. second launch = single-instance toggle: a visible popup window should appear
          Start-Process -FilePath $exe.FullName | Out-Null
          $popup = $null
          for ($i = 0; $i -lt 30 -and -not $popup; $i++) {
            Start-Sleep -Milliseconds 500
            $procs = @(Get-Process -Name $procName -ErrorAction SilentlyContinue)
            $pids = [uint32[]]($procs | ForEach-Object { $_.Id })
            $w = @(if ($pids.Count) { [WinProbe]::ForPids($pids) })
            $popup = $w | Where-Object { $f = $_ -split '\|', 5; $f[1] -eq '1' -and $f[4] -eq $env:PRODUCT } | Select-Object -First 1
          }
          Start-Sleep -Seconds 2
          $mw = @(Get-Process -Name $procName -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 })
          Write-Host ("Get-Process MainWindowTitle: " + (($mw | ForEach-Object { "'" + $_.MainWindowTitle + "'" }) -join ', '))
          if ($popup) {
            $f = $popup -split '\|', 5
            Pass "popup window '$($f[4])' is visible, size $($f[2]) x $($f[3])"
            Check (($f[2] -as [int]) -ge 380 -and ($f[2] -as [int]) -le 460 -and ($f[3] -as [int]) -ge 580 -and ($f[3] -as [int]) -le 700) "popup size is roughly 420 x 640 (accepting 380-460 x 580-700 at the runner's scale)"
          } else {
            Fail "no visible window titled '$env:PRODUCT' appeared after the second launch"
          }
          Check ($mw.Count -ge 1) 'Get-Process reports a main window handle after the second launch'
          Check (@(Get-Process -Name $procName -ErrorAction SilentlyContinue).Count -ge 1) 'the first instance is still alive after the second launch'

          # 5. screenshot of the whole screen
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$out\windows-screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Check ((Test-Path "$out\windows-screenshot.png") -and ((Get-Item "$out\windows-screenshot.png").Length -gt 5000)) "screenshot saved and is not empty ($($b.Width) x $($b.Height))"
          } catch { Fail "screenshot failed: $_" }

          # 6. best effort: list notification-area icons through UI Automation (never fails the job)
          try {
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            $A = [System.Windows.Automation.AutomationElement]
            $names = @('Notification Area', 'Overflow Notification Area', 'User Promoted Notification Area', 'System tray overflow window.', 'NotificationOverflow')
            $found = @()
            foreach ($n in $names) {
              $c = New-Object System.Windows.Automation.PropertyCondition ($A::NameProperty), $n
              $els = $A::RootElement.FindAll([System.Windows.Automation.TreeScope]::Descendants, $c)
              foreach ($el in $els) {
                $bc = New-Object System.Windows.Automation.PropertyCondition ($A::ControlTypeProperty), ([System.Windows.Automation.ControlType]::Button)
                $btns = $el.FindAll([System.Windows.Automation.TreeScope]::Descendants, $bc)
                Write-Host "UIA: container '$n' has $($btns.Count) button(s)"
                foreach ($bt in $btns) { Write-Host "UIA:   icon '$($bt.Current.Name)'"; $found += $bt.Current.Name }
              }
            }
            if ($found.Count -eq 0) { Write-Host 'UIA PROBE: no notification-area containers or icons found (the runner shell may not expose them)' }
            elseif ($found | Where-Object { $_ -like "*$env:PRODUCT*" -or $_ -like "*$env:SLUG*" }) { Write-Host "UIA PROBE: found an icon for $env:PRODUCT" }
            else { Write-Host "UIA PROBE: icons were listed but none is named like $env:PRODUCT (the tooltip may differ)" }
          } catch { Write-Host "UIA PROBE failed (best effort, ignored): $_" }

          # 7. stop the app and uninstall
          Get-Process -Name $procName -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $un = Get-ChildItem -Path $installDir -Filter *.exe -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'unins|uninstall' } | Select-Object -First 1
          if ($un) {
            $up = Start-Process -FilePath $un.FullName -ArgumentList '/S' -Wait -PassThru
            Write-Host "uninstaller exit code $($up.ExitCode)"
            for ($i = 0; $i -lt 30 -and (Test-Path $exe.FullName); $i++) { Start-Sleep -Seconds 1 }
            Check (-not (Test-Path $exe.FullName)) 'the app exe is gone after the silent uninstall'
          } else { Fail "no uninstaller found in $installDir" }

          # data written by the app (informational)
          $n = @(Get-ChildItem -Path $env:AGENTSBAR_DATA_DIR -Recurse -File -ErrorAction SilentlyContinue).Count
          Write-Host "files in the data folder: $n"
          Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName.Substring($root.Length) } | Out-File "$out\windows-synthetic-files.txt"
          Show-AppLogs
          if ($script:fails -gt 0) { Write-Host "RESULT: FAIL ($($script:fails) check(s) failed)"; exit 1 }
          Write-Host 'RESULT: PASS'

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-windows
          path: ${{ runner.temp }}/smoke-out
          if-no-files-found: warn

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PRODUCT: 'Agents Bar'
      SLUG: 'agents-bar-cross'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      - name: Build the release dmg (same as release.yml)
        run: npm run tauri build -- --bundles dmg

      - name: Mount, copy the app, run it, screenshot
        run: |
          set +e
          out="$RUNNER_TEMP/smoke-out"; mkdir -p "$out" "$RUNNER_TEMP/smoke"
          fails=0; label=macos
          pass() { echo "PASS: $*"; }
          fail() { echo "FAIL: $*"; fails=$((fails+1)); }
          warn() { echo "WARN: $*"; }
          cat > "$RUNNER_TEMP/smoke/helper.py" <<'HELPER_EOF'
          import json, os, sys, time, datetime
          root = sys.argv[2]
          now = time.time()
          iso = lambda s: datetime.datetime.fromtimestamp(s, datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          rec = lambda o: json.dumps(o) + "\n"
          sub = os.path.join(root, "claude", "-proj", "sess", "subagents"); os.makedirs(sub, exist_ok=True)
          cx = os.path.join(root, "codex", *datetime.date.today().isoformat().split("-")); os.makedirs(cx, exist_ok=True)
          cp = os.path.join(sub, "agent-c1.jsonl")
          with open(cp, "w") as h:
              h.write(rec({"type": "user", "timestamp": iso(now - 30), "cwd": "/demo/cwd", "message": {"role": "user", "content": [{"type": "text", "text": "do a demo task"}]}}))
              h.write(rec({"type": "assistant", "timestamp": iso(now - 20), "message": {"id": "m1", "usage": {"input_tokens": 10, "output_tokens": 20}, "content": [{"type": "text", "text": "working\nPROGRESS: 40% - demo claude note"}]}}))
          with open(cp.replace(".jsonl", ".meta.json"), "w") as h: json.dump({"agentType": "explorer", "description": "Demo Claude task", "prompt": "demo"}, h)
          xp = os.path.join(cx, "rollout-x1.jsonl")
          item = lambda p, ts: rec({"timestamp": iso(ts), "type": "response_item", "payload": p})
          with open(xp, "w") as h:
              h.write(rec({"timestamp": iso(now - 40), "type": "event_msg", "payload": {"type": "task_started"}}))
              h.write(item({"type": "message", "role": "user", "content": [{"type": "input_text", "text": "Demo Codex task"}]}, now - 37))
              h.write(item({"type": "message", "role": "assistant", "content": [{"type": "output_text", "text": "reply\nPROGRESS: 60% - demo codex note"}]}, now - 20))
              h.write(rec({"timestamp": iso(now - 10), "type": "turn_context", "payload": {"cwd": "/demo/work", "model": "demo-model"}}))
          HELPER_EOF
          cat > "$RUNNER_TEMP/smoke/prep.sh" <<'PREP_EOF'
          prep_env() {
            export AGENTSBAR_TEST=1 AGENTSBAR_DATA_DIR="$1/data" AGENTSBAR_CLAUDE_DIR="$1/t/claude" AGENTSBAR_CODEX_DIR="$1/t/codex" AGENTSBAR_NO_NOTIFICATIONS=1
            export AGENTSBAR_GH="$GITHUB_WORKSPACE/scripts/fake-gh.sh"
            chmod +x "$AGENTSBAR_GH"
            mkdir -p "$AGENTSBAR_DATA_DIR"
            python3 "$RUNNER_TEMP/smoke/helper.py" agents-transcripts "$1/t"
          }
          PREP_EOF

          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)
          echo "dmg: $dmg"
          mnt="$RUNNER_TEMP/dmg-mount"; mkdir -p "$mnt"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" || fail "hdiutil attach failed"
          src=$(ls -d "$mnt"/*.app | head -n 1)
          dest=$(mktemp -d /tmp/smoke-app.XXXXXX)
          cp -R "$src" "$dest/" || fail "copying the .app failed"
          hdiutil detach "$mnt" -force >/dev/null 2>&1
          app=$(ls -d "$dest"/*.app | head -n 1)
          xattr -cr "$app" 2>/dev/null
          bin=$(ls "$app"/Contents/MacOS/* | head -n 1)
          echo "app: $app, binary: $bin"
          [ -x "$bin" ] && pass "the .app was copied out of the dmg and has an executable" || fail "no executable in the app"

          root=$(mktemp -d); export HOME="$root/home"; mkdir -p "$HOME"
          . "$RUNNER_TEMP/smoke/prep.sh"; prep_env "$root"

          "$bin" >"$out/macos-app.out.log" 2>"$out/macos-app.err.log" &
          PID=$!
          sleep 10
          if kill -0 $PID 2>/dev/null; then pass "process $PID is alive after 10 s"; else fail "the app is not running after 10 s"; fi
          if grep -q 'tray icon created' "$out/macos-app.err.log"; then pass 'stderr says the tray icon was created'; else fail 'no "tray icon created" line in stderr'; fi
          "$bin" >/dev/null 2>&1 &
          sleep 5
          kill -0 $PID 2>/dev/null && pass 'the first instance survived the second launch (single instance)' || fail 'the first instance died after the second launch'
          # Window probe: CoreGraphics lists the windows of one pid without any permission prompt (names would need screen recording).
          # WARN only: the macOS popup may stay hidden after a second launch and this probe has never run on a runner.
          win=$(osascript -l JavaScript -e '
          ObjC.import("CoreGraphics");
          var l = ObjC.deepUnwrap(ObjC.castRefToObject($.CGWindowListCopyWindowInfo($.kCGWindowListOptionAll, 0)));
          l.filter(function (w) { return w.kCGWindowOwnerPID == '"$PID"'; }).map(function (w) { return w.kCGWindowIsOnscreen + "|" + w.kCGWindowBounds.Width + "x" + w.kCGWindowBounds.Height; }).join("\n");' 2>&1)
          echo "--- windows of pid $PID (onscreen|WxH):"; echo "$win" | sed 's/^/  /'
          if echo "$win" | awk -F'|' '($1=="1"||$1=="true") { split($2, a, "x"); if (a[1] >= 380 && a[1] <= 460 && a[2] >= 580 && a[2] <= 700) f = 1 } END { exit !f }'; then
            pass "a visible window of roughly 420x640 belongs to the app"
          else
            warn "no visible window of roughly 420x640 for pid $PID (probe is best effort; the screenshot is the other evidence)"
          fi
          if screencapture -x "$out/macos-screenshot.png" && [ -s "$out/macos-screenshot.png" ]; then pass "screenshot saved ($(wc -c < "$out/macos-screenshot.png") bytes)"; else warn 'screencapture failed or is empty (the runner may lack screen recording permission)'; fi
          n=$(find "$AGENTSBAR_DATA_DIR" -type f 2>/dev/null | wc -l); echo "[$label] files in the data folder: $n"
          echo "--- tray label lines in stderr:"; grep 'tray label' "$out/$label-app.err.log" 2>/dev/null | head -5 | sed 's/^/  /'
          # the default label is just "Agents Bar"; a count such as "2 running" proves the transcripts were really scanned
          if grep -qE 'tray label: [0-9]+ (running|finished)' "$out/$label-app.err.log"; then pass "[$label] the app scanned the synthetic transcripts and set a tray label with a count"; else warn "[$label] no tray label with a running/finished count in stderr (the scan may not have run or may have found nothing)"; fi
          kill $PID 2>/dev/null; sleep 1; kill -9 $PID 2>/dev/null
          [ -n "${FAKE_PID:-}" ] && kill "$FAKE_PID" 2>/dev/null
          find "$root" -type f | sed "s|^$root||" > "$out/macos-synthetic-files.txt"
          [ -f "$root/provider.log" ] && cp "$root/provider.log" "$out/macos-provider.log"
          if [ "$fails" -gt 0 ]; then echo "RESULT: FAIL ($fails check(s) failed)"; exit 1; fi
          echo "RESULT: PASS"

      - name: Upload screenshot and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-macos
          path: ${{ runner.temp }}/smoke-out
          if-no-files-found: warn
